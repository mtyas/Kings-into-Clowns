name: Build

# Every push builds and tests on all three platforms.
# Pushing a tag like v0.77 also publishes a GitHub release with the plugins attached.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            slug: windows-x64
            cmake_args: ""
            targets: KingsIntoClowns_CLAP KingsIntoClowns_VST3 KingsIntoClowns_Standalone
          - name: macOS
            os: macos-latest
            slug: macos-universal
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            targets: KingsIntoClowns_CLAP KingsIntoClowns_VST3 KingsIntoClowns_AU KingsIntoClowns_Standalone
          - name: Linux
            os: ubuntu-24.04
            slug: linux-x64
            cmake_args: ""
            targets: KingsIntoClowns_CLAP KingsIntoClowns_VST3 KingsIntoClowns_Standalone

    steps:
      - name: Long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev libglu1-mesa-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build plugins
        shell: bash
        run: cmake --build build --config Release --parallel 4 --target ${{ matrix.targets }}

      - name: DSP tests
        shell: bash
        run: |
          cmake --build build --config Release --parallel 4 --target kings_into_clowns_test
          test_exe=$(find build -type f \( -name kings_into_clowns_test -o -name kings_into_clowns_test.exe \) | head -n 1)
          "$test_exe"

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || version="dev-${GITHUB_SHA::7}"
          cd build/KingsIntoClowns_artefacts/Release
          rm -f CLAP/*.exp CLAP/*.lib
          formats=$(ls -d CLAP VST3 Standalone AU 2>/dev/null | tr '\n' ' ')
          cp ../../../LICENSE ../../../THIRD_PARTY_NOTICES.md .
          zip_name="Kings-into-Clowns-${version}-${{ matrix.slug }}.zip"
          cmake -E tar cf "$zip_name" --format=zip $formats LICENSE THIRD_PARTY_NOTICES.md
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv "$zip_name" "$GITHUB_WORKSPACE/dist/"
          ls -la "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: Kings-into-Clowns-${{ matrix.slug }}
          path: dist/*.zip

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Kings into Clowns ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*.zip
